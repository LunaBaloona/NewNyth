[workspace]
resolver = "2"
members = [
    "crates/roccat-nyth-hid",
    "crates/roccat-nyth-profile",
    "crates/nythctl",
    "crates/nythd",
    "crates/nyth-config",
    "crates/nyth-mini",
]

[workspace.package]
version = "0.9.5"
edition = "2024"
# eframe/egui 0.37 is what forces this MSRV (its own rust-version is 1.95).
rust-version = "1.95"
license = "GPL-2.0-or-later"
# Note: cargo 1.100 warns about unused `workspace.package` fields. Only the
# fields actually inherited by member crates (version, edition, rust-version,
# license) may live here; `description` is per-crate and the author/repo
# attribution is carried by README, LICENSE and the packaging metadata.

[workspace.dependencies]
thiserror = "2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.32", features = ["ioctl", "fs"] }
bytemuck = { version = "1", features = ["derive"] }
# The "string" feature lets clap's --version flag take a runtime-built
# string, which we need for the git commit suffix in version_with_commit().
clap = { version = "4", features = ["derive", "string"] }
zbus = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.37"
# Only here to enable egui's monochrome emoji fallback fonts, which the UI
# relies on for its text-glyph icons (gear, lightbulb, mouse, refresh): they
# became opt-in after eframe 0.30, and eframe does not re-export the feature.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
