[workspace]
resolver = "2"
members = [
    "crates/roccat-nyth-hid",
    "crates/roccat-nyth-profile",
    "crates/nythctl",
    "crates/nythd",
    "crates/nyth-config",
    "crates/nyth-mini",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
# image 0.25 requires 1.88; clap 4.6 requires 1.85.
rust-version = "1.95"
license = "GPL-2.0-or-later"
authors = [
    "NewNyth Contributors",
    "Stefan Achatz (original roccat-tools author)",
]
description = "NewNyth is a modern Linux driver and configuration tool for the Roccat Nyth mouse"
repository = "https://github.com/LunaBaloona/NewNyth"

[workspace.dependencies]
thiserror = "2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.31", features = ["ioctl", "fs"] }
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
dbus = "0.9"
dbus-crossroads = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.37"
# Only here to enable egui's monochrome emoji fallback fonts, which the UI
# relies on for its text-glyph icons (⚙💡🖱🔄 …): they became opt-in after
# eframe 0.30, and eframe does not re-export the feature.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
