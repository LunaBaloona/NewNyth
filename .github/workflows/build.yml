name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Default: read-only token; jobs opt in to more below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libfontconfig1-dev \
            mesa-common-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build (all crates)
        run: cargo build --release --all --locked

      - name: Run tests
        run: cargo test --release --locked --workspace

      - name: Clippy
        run: cargo clippy --release --locked --workspace --all-targets -- -D warnings

  audit:
    # Dependabot PRs get a read-only token that cannot write check
    # annotations; advisories introduced by a bump are still caught by the
    # audit run on the resulting push to main.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Security audit (RustSec advisories)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
