[workspace]
resolver = "2"
members = [
    "crates/roccat-nyth-hid",
    "crates/roccat-nyth-profile",
    "crates/nythctl",
    "crates/nythd",
    "crates/nyth-config",
    "crates/nyth-mini",
]

[workspace.package]
version = "0.7.1"
edition = "2021"
license = "GPL-2.0-or-later"
authors = [
    "NewNyth Contributors",
    "Stefan Achatz (original roccat-tools author)",
]
description = "NewNyth is a modern Linux driver and configuration tool for the Roccat Nyth mouse"
repository = "https://github.com/LunaBaloona/NewNyth"

[workspace.dependencies]
thiserror = "2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["ioctl", "fs"] }
bytemuck = { version = "1", features = ["derive"] }
clap = { version = ">=4.4, <4.5", features = ["derive"] }
dbus = ">=0.9, <0.10"
dbus-crossroads = ">=0.5, <0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.27"
